name: Validate Packages

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 'checkout'
        uses: actions/checkout@v4

      - name: 'set up node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 'install dependencies'
        run: npm ci

      - name: 'typecheck src'
        run: npm run typecheck:src

      - name: 'lint'
        run: npm run lint

      - name: 'build'
        run: npm run build

      - name: 'test'
        run: npm test -- --ci

      - name: 'typecheck build'
        run: npm run typecheck:build
